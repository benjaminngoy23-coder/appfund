providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PORT = "8000"
DATA_DIR = "/app/data"
SEED_DEMO_USERS = "false"

[phases.install]
cmds = ["python -m pip install --disable-pip-version-check -r requirements.txt"]

[phases.build]
cmds = ["python -m py_compile app.py main.py"]

[start]
cmd = "python main.py"
